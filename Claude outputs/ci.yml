name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: test-api-key
          USE_MOCK: "true"
          QDRANT_URL: ":memory:"
        run: uv run pytest -v
