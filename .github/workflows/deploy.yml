name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/257834206518/locations/global/workloadIdentityPools/github-actions-pool/providers/github
          service_account: github-actions@pr-review-assistant-509122.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t europe-north1-docker.pkg.dev/pr-review-assistant-509122/pr-review-assistant/pr-review-assistant:${{ github.sha }} .
          docker push europe-north1-docker.pkg.dev/pr-review-assistant-509122/pr-review-assistant/pr-review-assistant:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pr-review-assistant \
            --image europe-north1-docker.pkg.dev/pr-review-assistant-509122/pr-review-assistant/pr-review-assistant:${{ github.sha }} \
            --region europe-north1 \
            --project pr-review-assistant-509122